<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>配色チェック｜現場試作</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;color:#172235;background:#eef2f7}*{box-sizing:border-box}body{margin:0}.app{max-width:560px;margin:auto;min-height:100dvh;background:#fff;padding:18px 16px 95px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-size:20px;font-weight:800}.sub{color:#667387;font-size:12px}.pill{background:#eaf5ef;color:#187a48;border-radius:20px;padding:6px 10px;font-size:12px;font-weight:700}.warning{border:1px solid #f3b4b4;background:#fff3f3;color:#b4232c;border-radius:12px;padding:12px;margin:14px 0;font-weight:700}.warning small{display:block;font-weight:400;margin-top:5px}.nav{display:flex;gap:7px;margin:18px 0 14px}.nav button{flex:1;background:#eef2f7;color:#314156}.nav button.active{background:#253b63;color:white}.card{border:1px solid #dce3ec;border-radius:16px;padding:16px;margin:13px 0;box-shadow:0 2px 8px #15243b08}.title{font-weight:800;font-size:18px;margin-bottom:8px}.muted{color:#6b7687;font-size:13px}.stats{background:#f0f5fc;border-radius:14px;text-align:center;padding:18px;margin:12px 0}.big{font-size:45px;font-weight:850;color:#183b6b;line-height:1.2}.row{display:flex;justify-content:space-between;gap:12px;margin:10px 0;align-items:center}.row b{font-variant-numeric:tabular-nums}button,.button{font:inherit;cursor:pointer;border:0;border-radius:11px;padding:13px 15px;font-weight:700;background:#243e69;color:white}button.secondary{background:#eef2f7;color:#243b5c}button.danger{background:#b4232c}button.outline{background:white;color:#243e69;border:1px solid #cbd6e5}button:disabled{opacity:.45}button.full{width:100%;margin:5px 0}input,select{font:inherit;width:100%;padding:12px;border:1px solid #ccd5e1;border-radius:10px;background:white;margin:5px 0 12px}label{font-size:13px;font-weight:700}.hint{font-size:12px;color:#697689;line-height:1.6}.photo{width:100%;max-height:260px;object-fit:contain;border-radius:10px;background:#f2f5f8;margin:7px 0}.placeholder{background:#f3f5f8;color:#7a8593;text-align:center;border-radius:10px;padding:35px 10px;margin:8px 0}.actions{display:grid;gap:8px}.two{grid-template-columns:1fr 1fr}.red{color:#b4232c}.green{color:#167748}.footer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e3e7ed;padding:9px max(14px,calc((100vw - 530px)/2));font-size:11px;color:#697689;text-align:center}.chip{display:inline-block;background:#e8edf4;border-radius:8px;padding:4px 8px;font-size:12px;margin:3px}.line{border-top:1px solid #e2e8ef;margin:12px 0}.hide{display:none}.smallbtn{padding:8px 10px;font-size:12px}h2{font-size:17px;margin:20px 0 8px}</style></head><body><main class="app" id="app"></main><div class="footer">試作 v0.1｜AI判定・サーバー共有・通知は未接続｜入力データはこの端末のブラウザ内に保存</div><script>
const KEY='weave-demo-v01';const defaults=()=>({worker:'担当者',loom:'2',screen:'home',jobs:{'2':{name:'MAT',pattern:'1234',color:'A',order:100,done:70,reason:'',last:null},'3':{name:'ND14',pattern:'2040',color:'B',order:80,done:55,reason:'',last:null},'4':{name:'',pattern:'',color:'A',order:0,done:0,reason:'',last:null}},photos:{},checks:[],alerts:[],drafts:{}});let state;try{state=JSON.parse(localStorage.getItem(KEY))||defaults()}catch(e){state=defaults()}let pendingPhoto={};const $=id=>document.getElementById(id);const save=()=>localStorage.setItem(KEY,JSON.stringify(state));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const job=()=>state.jobs[state.loom];const pic=(key,label)=>state.photos[key]?`<img class="photo" alt="${label}" src="${state.photos[key]}">`:`<div class="placeholder">${label}は未登録</div>`;function go(screen){state.screen=screen;save();render()}function btn(text,fn,cls=''){return `<button class="${cls}" onclick="${fn}">${text}</button>`}function alertBanner(){let alerts=state.alerts.filter(a=>!a.resolved);return alerts.length?`<div class="warning">⚠ 再チェックが必要：${alerts.length}件${alerts.map(a=>`<small>${esc(a.loom)}号機：${esc(a.detail)} ${btn('確認','showAlert('+a.id+')','smallbtn outline')}</small>`).join('')}</div>`:''}function render(){let j=job(),p=state.photos;let h=`<div class="top"><div><div class="brand">🧵 配色チェック</div><div class="sub">現場用アプリ・操作試作</div></div><span class="pill">${esc(state.worker)}</span></div>${alertBanner()}<div class="nav">${['2','3','4'].map(n=>`<button class="${state.loom===n?'active':''}" onclick="switchLoom('${n}')">${n}号機</button>`).join('')}</div>`;
if(state.screen==='home'){h+=`<div class="row"><span class="title">${esc(state.loom)}号機｜${j.name?'製織中':'仕事未登録'}</span>${btn('担当者変更','go(\'worker\')','secondary smallbtn')}</div><div class="card"><div class="title">${esc(j.name||'新しい仕事')} ${j.name?'／ '+esc(j.color)+'色':''}</div><div class="muted">紋番号：${esc(j.pattern||'未設定')}</div><div class="stats"><div class="muted">この織物はあと</div><div class="big">${Math.max(0,j.order-j.done)}本</div><div class="muted">の予定です</div></div><div class="row"><span>注文数</span><b>${j.order}本</b></div><div class="row"><span>登録済み製織数</span><b>${j.done}本</b></div>${j.done>j.order?`<div class="red">超過 ${j.done-j.order}本</div>`:''}${j.reason?`<div class="hint">最新の変更：${esc(j.reason)}</div>`:''}</div><div class="card"><div class="title">見本写真</div>${pic('sample_'+state.loom,'見本写真')}<div class="hint">試作版では端末内の写真を登録します。過去の見本の自動照合は今後実装。</div><input aria-label="見本写真を選択" type="file" accept="image/*" onchange="upload(this,'sample_'+state.loom)"></div><div class="actions">${btn('📷 配色を再チェック','startCheck(true)','full outline')}${btn('次の織物をチェック','go(\'count\')','full')}${btn('そのままの配色で織る','go(\'countSame\')','full secondary')}${btn('仕事・注文数を編集','go(\'edit\')','full secondary')}${btn('チェック履歴を見る','go(\'history\')','full secondary')}</div>`}
if(state.screen==='worker'){h+=`<h2>使用者確認</h2><label>担当者名</label><input id="worker" value="${esc(state.worker)}"><button class="full" onclick="state.worker=$('worker').value.trim()||'担当者';save();go('home')">この担当者で進む</button>`}
if(state.screen==='count'||state.screen==='countSame'){h+=`<h2>前の織物の本数登録</h2><div class="card"><b>${esc(j.name||'未登録')} ／ ${esc(j.color)}色</b><p class="muted">前回の操作から今回までに、この織機で何本織りましたか？</p><label>今回織った本数（0本でも可）</label><input type="number" id="count" min="0" step="1" value="0"><div class="hint">入力分を累計に加算します。あとから管理画面で修正できる設計です。</div></div><button class="full" onclick="addCount('${state.screen==='countSame'?'same':'new'}')">登録して進む</button>${btn('戻る','go(\'home\')','full secondary')}`}
if(state.screen==='edit'){h+=`<h2>現在の仕事を設定</h2><div class="card"><label>品名</label><input id="name" value="${esc(j.name)}"><label>紋番号</label><input id="pattern" value="${esc(j.pattern)}"><label>配色</label><input id="color" value="${esc(j.color)}"><label>注文本数</label><input id="order" type="number" min="0" value="${j.order}"><label>変更理由（任意）</label><select id="reason"><option value="">選択なし</option><option>納品本数変更による増減</option><option>傷による織り直し</option><option>その他</option></select><label>補足（任意）</label><input id="memo" placeholder="変更内容など"></div><button class="full" onclick="editJob()">保存する</button>${btn('戻る','go(\'home\')','full secondary')}`}
if(state.screen==='check'){h+=`<h2>${state.recheck?'配色を再チェック':'次の織物をチェック'}</h2><div class="card"><div class="title">${esc(j.name)} ／ ${esc(j.color)}色</div><div class="stats"><div class="muted">この織物はあと</div><div class="big">${Math.max(0,j.order-j.done)}本</div><div class="muted">の予定です</div></div><label>発注書・製織指示書の写真</label>${pic('order_'+state.loom,'指示書')}<input type="file" accept="image/*" capture="environment" onchange="upload(this,'order_'+state.loom)"><label>織り始め約10cmの写真</label>${pic('cloth_'+state.loom,'織物')}<input type="file" accept="image/*" capture="environment" onchange="upload(this,'cloth_'+state.loom)"><div class="hint">※ この試作版ではAIによる写真解析は行いません。以下は操作確認用の模擬判定です。</div></div><div class="actions">${btn('模擬判定：一致','mockResult(\'match\')','full')}${btn('模擬判定：入れ違い疑い','mockResult(\'suspect\')','full danger')}${btn('模擬判定：判定不能','mockResult(\'unknown\')','full secondary')}${btn('戻る','go(\'home\')','full secondary')}</div>`}
if(state.screen==='result'){let r=state.result||'unknown';h+=`<h2>配色チェック結果</h2><div class="card"><div class="title ${r==='suspect'?'red':r==='match'?'green':''}">${r==='match'?'✓ 一致（模擬）':r==='suspect'?'⚠ 入れ違い疑い（模擬）':'判定不能（模擬）'}</div>${r==='suspect'?'<p class="red">例：3番と4番の杼箱が入れ違っている可能性があります。</p>':''}<div class="muted">今回の織物写真</div>${pic('cloth_'+state.loom,'織物')}<div class="muted">登録済み見本写真</div>${pic('sample_'+state.loom,'見本写真')}<div class="hint">判定表示は操作試験用。実際の配色一致を保証するものではありません。</div></div><div class="actions">${btn('目視確認：問題なし・確認完了','confirmResult()','full')}${btn('糸を修正して再撮影','go(\'check\')','full outline')}${btn('戻る','go(\'check\')','full secondary')}</div>`}
if(state.screen==='history'){h+=`<h2>チェック履歴</h2>${state.checks.filter(x=>x.loom===state.loom).slice().reverse().map(x=>`<div class="card"><b>${esc(x.job)} ／ ${esc(x.color)}色</b><div class="muted">${esc(x.date)} ／ ${esc(x.worker)}</div><div>${esc(x.result)}（模擬判定）</div></div>`).join('')||'<p class="muted">履歴はまだありません。</p>'}${btn('戻る','go(\'home\')','full secondary')}`}
if(state.screen==='alert'){let a=state.alerts.find(x=>x.id===state.alertId);h+=`<h2 class="red">再チェック警告</h2><div class="warning">${a?esc(a.loom)+'号機：'+esc(a.detail):'警告が見つかりません'}</div><div class="actions">${btn('警告音を停止（表示は残す）','muteAlert()','full secondary')}${btn('問題なし・警告解除','resolveAlert()','full')}${btn('修正して再チェック','resolveAndCheck()','full outline')}${btn('戻る','go(\'home\')','full secondary')}</div>`}
$('app').innerHTML=h}
function switchLoom(n){state.loom=n;state.screen='home';save();render()}function addCount(next){let n=Number($('count').value);if(!Number.isInteger(n)||n<0){alert('0以上の整数を入力してください');return}let j=job();j.done+=n;j.last=new Date().toLocaleString('ja-JP');save();if(next==='same'){go('home')}else{state.recheck=false;go('edit')}}function editJob(){let j=job(),old=j.order;let n=Number($('order').value);if(!Number.isInteger(n)||n<0){alert('注文数を確認してください');return}j.name=$('name').value.trim();j.pattern=$('pattern').value.trim();j.color=$('color').value.trim()||'A';j.order=n;let reason=$('reason').value,memo=$('memo').value.trim();if(old!==n)j.reason=`${old}本 → ${n}本（${reason||'理由未登録'}${memo?'：'+memo:''}）`;save();go('home')}function startCheck(recheck){state.recheck=recheck;go('check')}function mockResult(result){if(!state.photos['cloth_'+state.loom]){alert('先に織物の写真を選択してください');return}state.result=result;save();go('result')}function confirmResult(){let j=job();state.checks.push({loom:state.loom,job:j.name,color:j.color,worker:state.worker,date:new Date().toLocaleString('ja-JP'),result:state.result});if(state.result==='suspect'){state.alerts.push({id:Date.now(),loom:state.loom,detail:'模擬判定：配色の入れ違い疑い',resolved:false,muted:false})}save();go('home')}function showAlert(id){state.alertId=id;go('alert')}function muteAlert(){let a=state.alerts.find(x=>x.id===state.alertId);if(a)a.muted=true;save();go('home')}function resolveAlert(){let a=state.alerts.find(x=>x.id===state.alertId);if(a){a.resolved=true;a.resolvedBy=state.worker}save();go('home')}function resolveAndCheck(){resolveAlert();startCheck(true)}function upload(el,key){let file=el.files&&el.files[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{let img=new Image();img.onload=()=>{let canvas=document.createElement('canvas');let scale=Math.min(1,1400/Math.max(img.width,img.height));canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);state.photos[key]=canvas.toDataURL('image/jpeg',.72);try{save();render()}catch(e){alert('端末の保存容量が足りません。写真を減らしてください')}};img.src=reader.result};reader.readAsDataURL(file)}render();
</script></body></html>
