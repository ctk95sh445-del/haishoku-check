<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#203c69"><title>配色チェック｜現場試作 v0.5</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;color:#152b49;background:#f7f9fc}*{box-sizing:border-box}body{margin:0}main{max-width:660px;margin:auto;padding:20px 16px 100px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}h1{font-size:25px;margin:0}h2{font-size:21px;margin:12px 0 18px}h3{margin:0 0 12px}small,.muted{color:#61748e}button,input,select{font:inherit}button{border:0;border-radius:14px;padding:16px 14px;font-weight:800;font-size:17px;cursor:pointer}button.primary{background:#263e6b;color:white}button.secondary{background:#e9eff7;color:#223b63}button.warn{background:#a52222;color:white}button.outline{background:white;border:1px solid #b7c7db;color:#223b63}button:disabled{opacity:.4}button.full{width:100%;margin:8px 0}button.small{padding:10px;font-size:14px} .tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:20px 0}.tabs button.active{background:#263e6b;color:white}.tabs button{background:#e9eff7;color:#223b63}.card{background:white;border:1px solid #d7e1ef;border-radius:19px;padding:19px;margin:14px 0;box-shadow:0 2px 10px #142b4507}.big{font-size:44px;font-weight:900;text-align:center;margin:4px}.center{text-align:center}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.stack{display:grid;gap:10px}label{font-size:15px;font-weight:800;display:block;margin:14px 0 6px}input:not([type=file]),select{width:100%;padding:14px;border:1px solid #b9c9dc;border-radius:12px;background:white;font-size:18px}.photo-input{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}.photo-button{display:block;text-align:center;background:#263e6b;color:white;padding:18px 12px;border-radius:14px;font-size:18px;font-weight:800;margin:14px 0;cursor:pointer}.photo-hint{color:#60738c;text-align:center;font-size:14px;margin:10px 0}img.preview{max-width:100%;max-height:260px;object-fit:contain;border-radius:12px;display:block;margin:10px auto}.pill{background:#e5f3eb;color:#17683e;border-radius:20px;padding:8px 12px;font-size:13px;font-weight:800}.step{color:#637997;font-weight:700;font-size:13px}.notice{background:#fff4d8;border:1px solid #efcf80;border-radius:12px;padding:13px;margin:14px 0;color:#6b4b14}.danger{background:#ffebeb;border:2px solid #c63d3d;border-radius:13px;padding:15px;color:#8b2020;margin:14px 0}.ok{background:#e6f6ec;border:1px solid #a9d8b8;border-radius:12px;padding:15px;color:#195e35}.footer{text-align:center;color:#75849b;font-size:12px;margin:28px 0}.meta{font-size:14px;line-height:1.8}.pair{display:flex;justify-content:space-between;border-bottom:1px solid #e8edf3;padding:9px 0}.pair:last-child{border:0}.actions{display:grid;gap:6px}.previewbox{background:#edf1f6;border-radius:12px;min-height:95px;display:grid;place-items:center;color:#7d8a9a;margin:10px 0}.back{background:transparent;color:#29466f;padding:9px 0;text-align:left}.counter{font-size:15px;color:#526883}.warningline{color:#ad2222;font-weight:900}.sub{font-size:13px;font-weight:normal} .check{display:flex;align-items:flex-start;gap:10px;font-size:16px;font-weight:700;margin:18px 0}.check input{width:24px;height:24px;flex-shrink:0} @media(min-width:600px){main{padding:28px 24px}}
</style></head><body><main id="app"></main><script>
(()=>{'use strict';const KEY='haishoku-field-v02';const DEMO={name:'SHIPS 定番スト',pattern:'OS-0717',order:'13004',instruction:'21415',colors:{A:{qty:48,yarns:['131','S28','S5','294','TF99','Y24']},B:{qty:42,yarns:['131','S16','S1','131','TF99','N345']},C:{qty:78,yarns:['131','S28','S1','131','TF99','Y24']}},types:['3×1','シルクメランジ','シルクメランジ','3×1','3×2','3×3']};let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch(e){};if(!data||!data.looms)data={worker:'',loom:'2',looms:{'2':null,'3':null,'4':null},history:[]};let page='home',flow=null,preview={paper:null,cloth:null};const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem(KEY,JSON.stringify(data));const btn=(label,fn,cls='secondary')=>`<button class="full ${cls}" data-act="${fn}">${label}</button>`;const curr=()=>data.looms[data.loom];const remain=j=>Math.max(0,(+j.qty||0)-(+j.done||0));const extra=j=>Math.max(0,(+j.done||0)-(+j.qty||0));const info=j=>`<div class="pair"><span>注文数</span><b>${j.qty}本</b></div><div class="pair"><span>登録済み製織数</span><b>${j.done}本</b></div>`;const head=()=>`<header><div><h1>🧵 配色チェック</h1><small>現場用アプリ・操作試作 v0.5</small></div><span class="pill">${esc(data.worker||'担当者未設定')}</span></header><div class="tabs">${['2','3','4'].map(n=>`<button class="${data.loom===n?'active':''}" data-loom="${n}">${n}号機</button>`).join('')}</div>`;function render(){let h=head();if(page==='home'){let j=curr();h+=`<div class="row"><h2>${data.loom}号機｜${j?'製織中':'仕事未設定'}</h2><button class="small secondary" data-act="worker">担当者変更</button></div>`;if(j){h+=`<div class="card"><h2>${esc(j.name)} ／ ${esc(j.color)}色</h2><p class="muted">紋番号：${esc(j.pattern||'未登録')}</p><div class="previewbox"><div class="center">この織物はあと<div class="big">${remain(j)}本</div>の予定です${extra(j)?`<p class="warningline">超過 ${extra(j)}本</p>`:''}</div></div>${info(j)}</div>`;if(j.cloth)h+=`<div class="card"><h3>今回の見本写真</h3><img class="preview" src="${j.cloth}" alt="見本写真"></div>`;h+=`<div class="actions">${btn('📷 配色を再チェック','recheck','outline')}${btn('次の織物をチェック','next','primary')}${btn('そのままの配色で織る','same')}${btn('仕事・注文数を編集','edit')}${btn('チェック履歴を見る','history')}</div>`}else{h+=`<div class="card"><p>この織機の仕事はまだ登録されていません。</p></div>${btn('次の織物をチェック','next','primary')}${btn('仕事を手入力で設定（試作用）','edit')}${btn('チェック履歴を見る','history')}`}}
else if(page==='worker'){h+=`<h2>担当者を選択</h2><div class="card"><label>担当者名</label><input id="worker" value="${esc(data.worker)}" placeholder="例：山崎">${btn('保存して戻る','saveworker','primary')}${btn('戻る','home')}</div>`}
else if(page==='count'){let j=curr();h+=`<button class="back" data-act="home">← 戻る</button><div class="step">次の織物 1 / 4</div><h2>前の織物の本数を登録</h2><div class="card"><h3>${esc(j.name)} ／ ${esc(j.color)}色</h3><p>前回登録してから、何本織りましたか？</p><label>今回追加する本数</label><input id="count" type="number" min="0" step="1" inputmode="numeric" value="${flow.count??0}"><p class="muted">0本でもOK。あとで修正もできます。</p><p class="counter">現在の登録済み：${j.done}本</p>${btn('本数を登録して次へ','savecount','primary')}${btn('戻る','home')}</div>`}
else if(page==='samecount'){let j=curr();h+=`<button class="back" data-act="home">← 戻る</button><h2>そこまで何本織りましたか？</h2><div class="card"><h3>${esc(j.name)} ／ ${esc(j.color)}色</h3><p>前回の本数登録から、追加で織った本数を入力してください。</p><label>今回追加する本数</label><input id="samecount" type="number" min="0" step="1" inputmode="numeric" value="0"><p class="muted">0本でも登録できます。すでに登録した本数は重複して入力しないでください。</p><p class="counter">現在の登録済み：${j.done}本</p>${btn('本数を登録して製織中に戻る','savesamecount','primary')}${btn('戻る','home')}</div>`}
else if(page==='paper'){h+=`<button class="back" data-act="backpaper">← 戻る</button><div class="step">次の織物 ${flow.recheck?'1 / 2':'2 / 4'}</div><h2>${flow.recheck?'織物を撮影':'指示書・発注書を撮影'}</h2><div class="card"><p>${flow.recheck?'同じ仕事の配色を再チェックします。織り始めの織物を撮影してください。':'現場にある紙の発注書または製織指示書を撮影してください。'}</p><label class="photo-button" for="photo">📷 ${flow.recheck?'織り始め10cmの写真を撮ってください':'指示書・発注書の写真を撮ってください'}</label><input class="photo-input" type="file" accept="image/*" capture="environment" id="photo"><div class="photo-hint">${preview[flow.recheck?'cloth':'paper']?'撮影済み ✓　撮り直す場合は上のボタンを押してください':'タップするとカメラが開きます'}</div>${preview[flow.recheck?'cloth':'paper']?`<img class="preview" src="${preview[flow.recheck?'cloth':'paper']}" alt="撮影した写真">`:''}<div class="notice">写真の文字・色の自動判定はまだ未接続です。試作では次の画面で内容を確認します。</div>${btn('次へ','paperNext','primary')}${btn('戻る','backpaper')}</div>`}
else if(page==='details'){let demo=flow.demo===true,cs=demo?DEMO.colors:{[flow.color||'A']:{qty:flow.qty??'',yarns:flow.yarns||['','','','','','']}};let selected=cs[flow.color]||cs.A||Object.values(cs)[0];h+=`<button class="back" data-act="paper">← 戻る</button><div class="step">次の織物 3 / 4</div><h2>指示書の内容を確認</h2><div class="notice"><b>AI読み取りはまだ未接続</b><br>下の「サンプルを表示」で先ほどの指示書の確認画面を試せます。撮影した写真を自動解析した結果ではありません。</div>${btn('サンプル指示書のデータを表示','demo','outline')}<div class="card"><label>品名</label><input id="name" value="${esc(flow.name||'')}" placeholder="品名"><label>紋番号</label><input id="pattern" value="${esc(flow.pattern||'')}" placeholder="紋番号"><label>発注書番号</label><input id="order" value="${esc(flow.order||'')}" placeholder="発注書番号"><label>指示書番号</label><input id="instruction" value="${esc(flow.instruction||'')}" placeholder="指示書番号"><h3 style="margin-top:24px">配色を選択</h3><div class="tabs">${Object.entries(cs).map(([k,v])=>`<button type="button" data-color="${k}" class="${flow.color===k?'active':''}">${k}配色<br><span class="sub">${esc(v.qty)}本</span></button>`).join('')}</div><label>選択した配色の注文本数</label><input id="qty" type="number" min="0" step="1" inputmode="numeric" value="${esc(flow.qty??selected.qty)}"><h3 style="margin-top:24px">杼箱の糸番号・糸種</h3><p class="muted">糸番号は糸種と組み合わせて照合します。番号・手書き修正は必ず確認してください。</p>${Array.from({length:8},(_,i)=>`<div class="pair" style="align-items:center;gap:8px"><b style="min-width:52px">${i+1}番</b><div style="flex:1"><input aria-label="${i+1}番の糸番号" id="yarn${i}" value="${esc((flow.yarns||selected.yarns||[])[i]||'')}" placeholder="糸番号" style="padding:9px;font-size:16px"><small>${esc(demo?(DEMO.types[i]||'未使用'):'糸種：要確認')}</small></div></div>`).join('')}${demo?'<div class="notice">C配色は印字78本に手書き修正があるため、現場の原本で本数を確認してください。ここでは78本を仮表示しています。</div>':''}${btn('確認して織物撮影へ','detailsNext','primary')}${btn('戻る','paper')}</div>`} 
else if(page==='cloth'){h+=`<button class="back" data-act="details">← 戻る</button><div class="step">次の織物 4 / 4</div><h2>織り始めの織物を撮影</h2><div class="card"><p><b>${esc(flow.name)} ／ ${esc(flow.color)}色</b>　注文 ${flow.qty}本</p><p>織り始め約10cmの柄が分かるように撮影してください。</p><label class="photo-button" for="photo">📷 織り始め10cmの写真を撮ってください</label><input class="photo-input" type="file" accept="image/*" capture="environment" id="photo"><div class="photo-hint">${preview.cloth?'撮影済み ✓　撮り直す場合は上のボタンを押してください':'タップするとカメラが開きます'}</div>${preview.cloth?`<img class="preview" src="${preview.cloth}" alt="織物写真">`:''}${btn('配色チェックへ進む','clothNext','primary')}${btn('戻る','details')}</div>`}
else if(page==='result'){h+=`<button class="back" data-act="resultBack">← 戻る</button><h2>配色チェック結果</h2><div class="notice"><b>⚠️ AIはまだ未接続</b><div>ここでは結果をテスト用に選んで、確認後の動きを試せます。実際の配色が正しいという判定ではありません。</div></div><div class="card"><h3>${esc(flow.name)} ／ ${esc(flow.color)}色</h3>${preview.cloth?`<img class="preview" src="${preview.cloth}" alt="織物写真">`:''}<label>テスト用の判定結果</label><select id="verdict"><option value="unknown" ${flow.verdict==='unknown'?'selected':''}>判定不能（初期値）</option><option value="match" ${flow.verdict==='match'?'selected':''}>一致（模擬）</option><option value="swap" ${flow.verdict==='swap'?'selected':''}>入れ違い疑い（模擬）</option></select><label class="check"><input type="checkbox" id="confirmed" ${flow.confirmed?'checked':''}><span>指示書と実際の織物を目視で確認しました</span></label>${btn('確認して製織中へ','finish','primary')}${btn('撮り直す','resultBack')}</div>`}
else if(page==='edit'){let j=curr()||{name:'',pattern:'',color:'A',qty:0,done:0};h+=`<button class="back" data-act="home">← 戻る</button><h2>仕事・注文数を編集</h2><div class="notice">ここは管理・修正用の画面です。通常の「次の織物をチェック」では表示しません。</div><div class="card"><label>品名</label><input id="name" value="${esc(j.name)}"><label>紋番号</label><input id="pattern" value="${esc(j.pattern)}"><label>配色</label><input id="color" value="${esc(j.color)}"><label>注文本数</label><input id="qty" type="number" min="0" value="${j.qty}"><label>登録済み製織数</label><input id="done" type="number" min="0" value="${j.done}">${btn('変更を保存','saveedit','primary')}${btn('戻る','home')}</div>`}
else if(page==='history'){h+=`<button class="back" data-act="home">← 戻る</button><h2>チェック履歴</h2>${data.history.length?data.history.slice().reverse().map(x=>`<div class="card meta"><b>${esc(x.loom)}号機｜${esc(x.name)}／${esc(x.color)}色</b><div>${esc(x.date)}　${esc(x.verdict)}</div></div>`).join(''):'<div class="card">まだ履歴はありません。</div>'}${btn('戻る','home')}`}
h+=`<div class="footer">試作 v0.4｜AI判定・サーバー共有・通知は未接続<br>データはこのブラウザ内だけに保存されます</div>`;$('#app').innerHTML=h;document.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',()=>act(b.dataset.act)));document.querySelectorAll('[data-loom]').forEach(b=>b.addEventListener('click',()=>{data.loom=b.dataset.loom;save();page='home';flow=null;render()}));const photo=$('#photo');document.querySelectorAll('[data-color]').forEach(b=>b.addEventListener('click',()=>{flow.name=$('#name').value;flow.pattern=$('#pattern').value;flow.order=$('#order').value;flow.instruction=$('#instruction').value;flow.color=b.dataset.color;flow.qty=flow.demo?DEMO.colors[flow.color].qty:flow.qty;flow.yarns=flow.demo?[...DEMO.colors[flow.color].yarns]:flow.yarns;render()}));if(photo)photo.addEventListener('change',async e=>{let f=e.target.files?.[0];if(!f)return;const type=flow.recheck||page==='cloth'?'cloth':'paper';preview[type]=await shrink(f);render()});}
function shrink(f){return new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{let scale=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.7))};im.onerror=reject;im.src=r.result};r.onerror=reject;r.readAsDataURL(f)})}
function act(a){let j=curr();const get=id=>$('#'+id)?.value?.trim()||'';if(a==='home'){page='home'}else if(a==='worker'){page='worker'}else if(a==='saveworker'){data.worker=get('worker');save();page='home'}else if(a==='next'){flow={recheck:false,count:0,name:'',pattern:'',color:'A',qty:'',verdict:'unknown',confirmed:false};preview={paper:null,cloth:null};page=j?'count':'paper'}else if(a==='savecount'){let n=Number(get('count'));if(!Number.isInteger(n)||n<0)return alert('0以上の本数を入力してください');j.done+=n;save();flow.count=n;page='paper'}else if(a==='backpaper'){page=flow.recheck?'home':j?'count':'home'}else if(a==='paper'){page='paper'}else if(a==='paperNext'){if(flow.recheck){if(!preview.cloth)return alert('織物の写真を撮影してください');page='result'}else{if(!preview.paper)return alert('指示書・発注書の写真を撮影してください');page='details'}}else if(a==='demo'){Object.assign(flow,{demo:true,name:DEMO.name,pattern:DEMO.pattern,order:DEMO.order,instruction:DEMO.instruction,color:'A',qty:48,yarns:[...DEMO.colors.A.yarns]})}else if(a==='detailsNext'){flow.name=get('name');flow.pattern=get('pattern');flow.order=get('order');flow.instruction=get('instruction');flow.yarns=Array.from({length:8},(_,i)=>get('yarn'+i));flow.qty=Number(get('qty'));if(!flow.name||!flow.color||!Number.isInteger(flow.qty)||flow.qty<0)return alert('品名・配色・注文本数を確認してください');page='cloth'}else if(a==='clothNext'){if(!preview.cloth)return alert('織物の写真を撮影してください');page='result'}else if(a==='resultBack'){page=flow.recheck?'paper':'cloth'}else if(a==='finish'){flow.verdict=get('verdict');flow.confirmed=$('#confirmed')?.checked;if(!flow.confirmed)return alert('目視確認のチェックを入れてください');if(flow.verdict==='swap'&&!confirm('入れ違い疑いの模擬警告です。修正を確認してから進んでください。続けますか？'))return;let now=new Date().toLocaleString('ja-JP');if(flow.recheck){j.cloth=preview.cloth||j.cloth}else{data.looms[data.loom]={name:flow.name,pattern:flow.pattern,color:flow.color,qty:flow.qty,done:0,cloth:preview.cloth,order:flow.order,instruction:flow.instruction,yarns:flow.yarns}}data.history.push({loom:data.loom,name:flow.name,color:flow.color,date:now,verdict:({unknown:'判定不能・目視確認',match:'一致（模擬）・目視確認',swap:'入れ違い疑い（模擬）・目視確認'})[flow.verdict]});save();flow=null;preview={paper:null,cloth:null};page='home'}else if(a==='recheck'){flow={...j,recheck:true,verdict:'unknown',confirmed:false};preview={paper:null,cloth:null};page='paper'}else if(a==='same'){if(!j)return alert('先に仕事を設定してください');page='samecount'}else if(a==='savesamecount'){let raw=get('samecount');let n=Number(raw);if(raw===''||!Number.isInteger(n)||n<0)return alert('0以上の整数で本数を入力してください');j.done=(+j.done||0)+n;data.history.push({loom:data.loom,name:j.name,color:j.color,date:new Date().toLocaleString('ja-JP'),verdict:'同じ配色で継続・追加 '+n+'本'});save();page='home'}else if(a==='edit'){page='edit'}else if(a==='saveedit'){let name=get('name'),color=get('color'),qty=Number(get('qty')),done=Number(get('done'));if(!name||!color||!Number.isInteger(qty)||qty<0||!Number.isInteger(done)||done<0)return alert('入力内容を確認してください');data.looms[data.loom]={name,pattern:get('pattern'),color,qty,done,cloth:j?.cloth||null};save();page='home'}else if(a==='history'){page='history'}render()}
render();})();
</script></body></html>
